name: Android Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur (önbellekli)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırılabilir yap
        run: chmod +x gradlew

      - name: Release imza dosyalarını oluştur
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > vega-release.jks
            {
              echo "storeFile=vega-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=vega"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "Release keystore hazır."
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secret'ları yok; release APK debug anahtarıyla imzalanacak."
          fi

      # Normal push/PR'da sadece derleme kontrolü yapılır (APK saklanmaz).
      # APK dosyası sadece Actions sekmesinden elle "Run workflow" ile çalıştırınca üretilir.
      - name: Derle (kontrol) / APK üret (elle çalıştırınca)
        id: build
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
          else
            ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee build.log
          fi

      - name: Derleme sonucunu yorum olarak yaz
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.BUILD_OUTCOME;
            const ok = outcome === 'success';
            let body = `<!-- vega-ci -->\n### ${ok ? '✅ Derleme başarılı' : '❌ Derleme başarısız'} (\`${context.sha.substring(0, 7)}\`)\n`;
            body += `[Çalışma detayı](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
            if (!ok && fs.existsSync('build.log')) {
              const lines = fs.readFileSync('build.log', 'utf8').split('\n');
              const errs = lines.filter(l => /^e: |error:|FAILURE|What went wrong|Exception/.test(l)).slice(0, 40);
              const tail = lines.slice(-60);
              body += '\n<details><summary>Hatalar</summary>\n\n```\n' + errs.join('\n').substring(0, 20000) + '\n```\n</details>\n';
              body += '\n<details><summary>Son satırlar</summary>\n\n```\n' + tail.join('\n').substring(0, 30000) + '\n```\n</details>\n';
            }
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            } else {
              await github.rest.repos.createCommitComment({ ...context.repo, commit_sha: context.sha, body });
            }

      - name: Debug APK'yı yükle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vega-iptv-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Release APK'yı yükle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vega-iptv-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: İmza dosyalarını temizle
        if: always()
        run: rm -f vega-release.jks keystore.properties
